services:
  - type: web
    name: godfather-ea-server
    runtime: node
    plan: starter   # always on: the bot loop must not sleep
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: godfather-ea-db
          property: connectionString
      - key: KEY_SECRET
        generateValue: true
      - key: MT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: METAAPI_TOKEN
        sync: false        # paste your MetaApi token in the Render dashboard
      - key: LIVE_TRADING
        value: "false"     # set to "true" ONLY after a demo account has behaved well

databases:
  - name: godfather-ea-db
    plan: free
